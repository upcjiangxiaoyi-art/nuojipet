<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>糯叽桌宠动作预览</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            color: #eaf0f4;
            background:
                radial-gradient(circle at 20% 20%, rgba(197, 151, 96, 0.18), transparent 32%),
                linear-gradient(145deg, #171c23, #2b323c 56%, #20252d);
        }

        main {
            width: min(940px, calc(100vw - 24px));
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(240px, 0.72fr);
            gap: 22px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 26px;
            background: rgba(20, 25, 32, 0.72);
            box-shadow: 0 28px 80px rgba(0,0,0,0.36);
            backdrop-filter: blur(18px);
        }

        .stage {
            min-height: 520px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            overflow: hidden;
            background:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
                radial-gradient(circle at 50% 34%, #59626e, #343b45 62%, #2a3038);
            background-size: 30px 30px, 30px 30px, auto;
        }

        canvas {
            width: min(470px, 100%);
            height: auto;
            filter: drop-shadow(0 18px 18px rgba(0,0,0,0.24));
        }

        h1 { margin: 0 0 6px; font-size: 1.55rem; }
        p { margin: 0 0 18px; color: #afbac5; line-height: 1.6; }

        .controls {
            align-self: center;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        button, label {
            min-height: 42px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: inherit;
            background: rgba(255,255,255,0.075);
            font: inherit;
        }

        button { cursor: pointer; }
        button:hover { background: rgba(216, 169, 91, 0.22); }
        button.is-active { border-color: #d8a95b; background: rgba(216, 169, 91, 0.28); }

        label {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 12px;
            padding: 0 12px;
            color: #c5ced7;
        }

        @media (max-width: 720px) {
            main { grid-template-columns: 1fr; }
            .stage { min-height: 360px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="stage" aria-label="糯叽动画预览">
            <canvas id="nuoji-preview" width="500" height="500"></canvas>
        </section>
        <section class="controls">
            <h1>糯叽动作检查台</h1>
            <p>这是独立预览，不需要启动 SillyTavern。“想一想”检查滚动团子，“困嘟嘟”检查趴姿，“向左走／向右走”会循环播放步态，可以暂停后拖动进度，检查腿根和脚掌。</p>
            <div class="buttons">
                <button data-state="idle">陪伴</button>
                <button data-state="listening">听你说</button>
                <button data-state="thinking">想一想</button>
                <button data-state="happy">开心</button>
                <button data-state="confused">迷糊</button>
                <button data-state="petting">摸摸</button>
                <button data-state="nuzzling">蹭蹭你</button>
                <button data-state="sleeping">困嘟嘟</button>
                <button data-state="wave">挥爪</button>
                <button data-form="walking" data-direction="-1">向左走</button>
                <button data-form="walking" data-direction="1">向右走</button>
            </div>
            <label>
                <input id="pause-walk" type="checkbox" />
                暂停步态，逐帧检查
            </label>
            <label>
                步态进度
                <input id="walk-phase" type="range" min="0" max="1000" value="0" aria-label="步态进度" style="min-width:0;flex:1" />
            </label>
            <label>
                <input id="reduce-motion" type="checkbox" />
                减少动态效果
            </label>
        </section>
    </main>

    <script type="module">
        import { NuojiRenderer, PET_STATES, NUZZLE_DURATION_MS } from './pet-renderer.js';

        const canvas = document.getElementById('nuoji-preview');
        const renderer = new NuojiRenderer(canvas);
        renderer.start();

        let reactionTimer;
        let walking = false;
        let phase = 0;
        let lastTick = 0;
        const pauseWalk = document.getElementById('pause-walk');
        const phaseSlider = document.getElementById('walk-phase');
        const tick = (now) => {
            const delta = lastTick ? Math.min(80, now - lastTick) : 0;
            lastTick = now;
            if (walking && renderer.walkReady && !renderer.reducedMotion && !pauseWalk.checked && !document.hidden) {
                phase = (phase + delta / 1500) % 1;
                renderer.setWalkProgress(phase, 1);
                phaseSlider.value = String(Math.round(phase * 1000));
            }
            requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        phaseSlider.addEventListener('input', () => {
            pauseWalk.checked = true;
            phase = Number(phaseSlider.value) / 1000;
            renderer.setWalkProgress(phase, 1);
            renderer.draw(performance.now());
        });

        const setState = (state) => {
            clearTimeout(reactionTimer);
            walking = false;
            renderer.setForm(
                state === PET_STATES.SLEEPING
                    ? 'lying'
                    : state === PET_STATES.THINKING ? 'ball' : 'sitting',
            );
            renderer.setState(state);
            if (state === PET_STATES.NUZZLING) {
                reactionTimer = setTimeout(() => setState(PET_STATES.IDLE), NUZZLE_DURATION_MS);
            }
            document.querySelectorAll('button').forEach((button) => {
                button.classList.toggle('is-active', button.dataset.state === state);
            });
        };

        document.querySelectorAll('[data-state]').forEach((button) => {
            button.addEventListener('click', () => setState(button.dataset.state));
        });

        document.querySelectorAll('[data-form="walking"]').forEach((button) => {
            button.addEventListener('click', () => {
                clearTimeout(reactionTimer);
                walking = true;
                renderer.setWalkDirection(Number(button.dataset.direction));
                renderer.setForm('walking');
                renderer.setState(PET_STATES.IDLE);
                document.querySelectorAll('button').forEach((candidate) => candidate.classList.remove('is-active'));
                button.classList.add('is-active');
            });
        });

        document.getElementById('reduce-motion').addEventListener('change', (event) => {
            renderer.setReducedMotion(event.currentTarget.checked);
        });

        setState(PET_STATES.IDLE);
    </script>
</body>
</html>
